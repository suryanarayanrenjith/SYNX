# SYNX - the desktop release, built and published on every push.
#
# WHAT THIS PRODUCES
#
#   Windows   x86_64   an NSIS installer and a portable .zip
#   Linux     x86_64   a .deb, an .rpm and a portable .tar.gz
#   macOS     arm64    a .dmg for Apple silicon
#   macOS     x86_64   a .dmg for Intel
#
# ...plus one SHA256SUMS.txt covering all of them.
#
# THE VERSION NUMBER IS ASSIGNED HERE, NOT IN THE TREE
#
# Every run takes the highest version already published, adds one to the patch
# and releases that: 1.0.1, 1.0.2, and so on. The number in src-tauri is a
# floor rather than a statement, so raising it by hand still works, and the
# next release is then the number that was written rather than the one after
# the last one. See tools/version.py for why the alternative, committing a
# bump back to the branch that triggered the run, is not worth what it costs.
#
# EVERY RELEASE IS A BETA, AND THE NEWEST ONE IS THE HIGHLIGHTED ONE
#
# SYNX is in open beta and expects to stay there for a while, so "beta" is in
# the title of every release rather than being a state some releases are in.
# It is deliberately NOT marked as a GitHub prerelease: GitHub will not put the
# Latest badge on a prerelease, and a repository whose newest build is not the
# one its front page points at is a repository that hands people an old build.
#
# WHY NOT tauri-action
#
# This repository has a build of its own and it is not optional: the Rust
# simulation core and the recorder are compiled to WebAssembly and copied into
# web/ BEFORE the desktop host is built, because the host embeds web/ whole.
# An action that runs `tauri build` on its own would compile a host around a
# missing core. tools/build.py is the one description of that order, so the
# workflow calls it rather than restating it. tools/release.py owns the
# artefact names in the same way.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# The publish job creates releases and tags; nothing else here writes.
permissions:
  contents: write

# Two pushes in quick succession would otherwise both read the same "highest
# published version" and both try to release it.
concurrency:
  group: release
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ======================================================================
  # What this release is called, decided once so that four builds and a
  # publish cannot each arrive at a different answer.
  # ======================================================================
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.pick.outputs.version }}
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Work out the next version
        id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # A tag pushed by hand says what it wants to be called.
            version="${GITHUB_REF_NAME#v}"
          else
            # Otherwise: one past the highest that has already been published.
            version=$(gh release list --limit 200 --json tagName --jq '.[].tagName' \
                      | python3 tools/version.py --next)
          fi
          # An empty answer here would tag the release `v` and name it
          # "SYNX  Beta", which is a bad release rather than a failed run.
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "could not work out a version (got '$version')" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version"    >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

  # ======================================================================
  # Everything that can fail cheaply, before anything expensive starts.
  #
  # The unit tests and the repository's own checkers need the WebAssembly
  # modules but not the desktop host, which is what --no-host is for: this
  # job is three minutes, and the four builds it gates are twenty.
  # ======================================================================
  verify:
    name: Tests and checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Six of the checkers run the game's own JavaScript, which is the only
      # honest way to check JavaScript. See tools/synx/jsprobe.py.
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: verify

      - run: python tools/build.py --test --check --no-host

  # ======================================================================
  # Windows and the two Macs. All three have a Rust toolchain and a Python
  # on the image already, so they share one set of steps.
  # ======================================================================
  desktop:
    name: ${{ matrix.name }}
    needs: [version, verify]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x86_64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: macOS (Apple silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          # macos-latest is Apple silicon, so this one is a cross build. It is
          # the arrangement Tauri's own pipeline uses, and the alternative,
          # pinning an Intel runner image, is pinning something that is being
          # retired.
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable
        with:
          # wasm32 for the core and the recorder; the host triple for the host.
          targets: wasm32-unknown-unknown,${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Stamped before anything is compiled, so the installer, the executable's
      # own metadata and the launcher's BUILD row all read the same number the
      # release page does.
      - name: Stamp the version
        run: python tools/version.py --set ${{ needs.version.outputs.version }}

      # The npm package ships a PREBUILT binary. `cargo install tauri-cli`
      # would compile the bundler from source, which costs more than compiling
      # the game does.
      - name: Install the Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Build and bundle
        run: python tools/build.py --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Collect into dist/
        run: python tools/release.py --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # ======================================================================
  # Linux, in a Debian 12 container.
  #
  # WHY A CONTAINER AND NOT THE RUNNER ITSELF. A binary built against glibc
  # 2.39 will not start on glibc 2.35, and that is not a theoretical range: it
  # is the difference between "runs on Ubuntu 22.04, Debian 12 and RHEL 9" and
  # "does not". The runner images that are still supported are newer than the
  # systems people play on, so the build happens on the oldest base that still
  # carries WebKitGTK 4.1, which is exactly what Tauri's own distribution guide
  # asks for, while the runner label stays one that is not being retired
  # underneath us.
  #
  # The container is bare, so everything the other jobs get from the image is
  # installed here: a compiler, a Python, a Node, and Rust from rustup, because
  # Debian's own rustc is several years behind what Tauri needs.
  # ======================================================================
  linux:
    name: Linux (x86_64)
    needs: [version, verify]
    runs-on: ubuntu-24.04
    container:
      image: debian:12
    steps:
      - name: Install the build and webview dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl file git pkg-config xz-utils \
            python3 \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev patchelf
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      # rustup rather than dtolnay/rust-toolchain: that action drives a rustup
      # the hosted images already have, and this container has nothing.
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable \
                        --target wasm32-unknown-unknown
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-gnu

      - name: Stamp the version
        run: python3 tools/version.py --set ${{ needs.version.outputs.version }}

      - name: Install the Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      # The .rpm is written by the bundler itself, which links the `rpm` crate
      # rather than shelling out, so there is no rpmbuild to install.
      - name: Build and bundle
        run: python3 tools/build.py --target x86_64-unknown-linux-gnu --bundles deb,rpm

      - name: Collect into dist/
        run: python3 tools/release.py --target x86_64-unknown-linux-gnu

      - uses: actions/upload-artifact@v7
        with:
          name: dist-x86_64-unknown-linux-gnu
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # ======================================================================
  # One release, out of four platforms' worth of files.
  # ======================================================================
  publish:
    name: Publish
    needs: [version, desktop, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      # Each build wrote the sums for its own files. One list is what a person
      # checking a download actually wants, and the per-platform pieces have no
      # reason to be on the page beside it.
      - name: Merge the checksums
        run: |
          cd dist
          cat SHA256SUMS-*.txt | sort -k2 > SHA256SUMS.txt
          rm -f SHA256SUMS-*.txt
          ls -la
          echo '--- SHA256SUMS.txt ---'
          cat SHA256SUMS.txt

      - name: Write the release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          {
            echo "Open beta build ${VERSION}, from \`${GITHUB_SHA}\`."
            echo
            echo "| Platform | Download |"
            echo "| --- | --- |"
            echo "| Windows | \`-setup.exe\` to install, \`-portable.zip\` to just run it |"
            echo "| Linux | \`.deb\`, \`.rpm\`, or \`.tar.gz\` on any other distribution |"
            echo "| macOS (Apple silicon) | \`-apple-silicon.dmg\` |"
            echo "| macOS (Intel) | \`-intel.dmg\` |"
            echo
            echo "Nothing here is code-signed. Windows SmartScreen will ask once:"
            echo "choose More info, then Run anyway. macOS will refuse a"
            echo "double-click, so open it from the right-click menu the first"
            echo "time, or run \`xattr -dr com.apple.quarantine /Applications/SYNX.app\`."
            echo
            echo "The Linux builds are made on Debian 12, so they need glibc 2.36"
            echo "or newer and a WebKitGTK 4.1 runtime."
            echo
            echo "\`SHA256SUMS.txt\` covers every file above."
            echo
            echo "**Photosensitivity warning:** SYNX contains rapidly flashing"
            echo "lights, high-contrast strobing and saturated neon effects."
            echo
            echo "SYNX is in open beta. Expect bugs, and please report them."
          } > NOTES.md
          cat NOTES.md

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: SYNX ${{ needs.version.outputs.version }} Beta
          body_path: NOTES.md
          target_commitish: ${{ github.sha }}
          files: dist/*
          fail_on_unmatched_files: true
          # Beta by name, not by GitHub's prerelease flag: a prerelease cannot
          # hold the Latest badge, and the newest beta is exactly what the
          # repository should be pointing people at.
          prerelease: false
          make_latest: true
